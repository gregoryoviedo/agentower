name: Agentower
options:
  bundleIdPrefix: dev.agentower
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: "Manual"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    OTHER_CODE_SIGN_FLAGS: ""
    PRODUCT_NAME: Agentower

targets:
  Agentower:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Agentower
      - path: Agentower/Resources/remote-bot
        type: file
        buildPhase: resources
    info:
      path: Agentower/Info.plist
      properties:
        CFBundleName: Agentower
        CFBundleDisplayName: Agentower
        CFBundleIdentifier: dev.agentower.app
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "13.0"
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "MIT"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_ENTITLEMENTS: ""
        COMBINE_HIDPI_IMAGES: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentower.app
    entitlements:
      path: Agentower/Agentower.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.cs.allow-jit: false
        com.apple.security.cs.allow-unsigned-executable-memory: false
        com.apple.security.cs.disable-library-validation: true