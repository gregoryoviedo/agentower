version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    # Curated set: catches real bugs without flooding CI with style noise.
    - errcheck       # unchecked errors
    - govet          # standard go vet
    - ineffassign    # unused assignments
    - staticcheck    # extensive static analysis (includes gosimple + stylecheck in v2)
    - unused         # unused symbols
    - bodyclose      # HTTP body close
    - errorlint      # error wrapping style
    - unconvert      # unnecessary conversions
    - unparam        # unused function params
    # NOTE: revive (exported/package-comments), gocritic (exitAfterDefer),
    # nilerr (intentional in user-facing error paths), misspell (false
    # positives on Spanish user-facing strings) intentionally off.

  exclusions:
    rules:
      # Don't flag deferred Close() in production code (Go idiom).
      - path: (\.go)$
        text: "Error return value of `.*\\.Close` is not checked"
        linters: [errcheck]
      # Test helpers are allowed to swallow errors.
      - path: _test\.go$
        linters: [errcheck]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gregoryoviedo/agentower
